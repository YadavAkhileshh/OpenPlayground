<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixed Fence | Rectangle Lab</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Fixed Fence</h1>
      <p>You have 24 metres of fencing. Which rectangle gives a garden the most space?</p>
    </header>
    <section aria-label="Garden experiment">
      <figure><div id="garden" role="img"></div><figcaption id="dimensions"></figcaption></figure>
      <div class="controls">
        <label for="width">Garden width <output for="width" id="width-value"></output></label>
        <input type="range" id="width" min="1" max="11" value="2">
        <div class="range-labels" aria-hidden="true"><span>1 m</span><span>11 m</span></div>
        <dl><div><dt>Fence length</dt><dd>24 m</dd></div><div><dt>Garden area</dt><dd id="area"></dd></div></dl>
        <button id="record">Record this garden</button>
        <p role="status" id="feedback">Try two different widths. Compare the areas you record.</p>
      </div>
    </section>
    <section class="notes" aria-label="Recorded measurements">
      <h2>Field notes</h2>
      <ul id="notes"><li id="empty">Your recorded widths, lengths and areas appear here.</li></ul>
    </section>
    <footer>Made by <a href="https://math.hjinlabs.com/?lang=en">ModuMath</a></footer>
  </main>
</body>
</html>
